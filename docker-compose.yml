# =============================================================================
# Job Ops - Docker Compose Configuration
# =============================================================================

services:
  job-ops:
    build:
      context: .
      dockerfile: Dockerfile
    image: job-apply:latest
    container_name: job-apply
    ports:
      - "3005:3001"
    volumes:
      # Persist database and generated PDFs
      - ./data:/app/data
    environment:
      # Server config
      - NODE_ENV=production
      - PORT=3001

      # Python path (uses system python in container)
      - PYTHON_PATH=/usr/bin/python3

    env_file:
      - path: ./.env
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    develop:
      watch:
        # Rebuild container when package.json changes
        - path: ./orchestrator/package.json
          action: rebuild
        - path: ./orchestrator/package-lock.json
          action: rebuild
        # Sync source code changes and rebuild inside container
        - path: ./orchestrator/src
          target: /app/orchestrator/src
          action: sync+restart
        # Sync extractor changes
        - path: ./extractors/adzuna/src
          target: /app/extractors/adzuna/src
          action: sync+restart
        - path: ./extractors/jobspy
          target: /app/extractors/jobspy
          action: sync+restart

  # Legacy WhatsApp webhook relay. Direct notifications can now be configured
  # in Settings; enable this profile only for webhook-based deployments.
  whatsapp-relay:
    image: job-apply:latest
    command: ["node", "/app/scripts/whatsapp-notify-relay.mjs"]
    env_file:
      - path: ./.env
        required: false
    environment:
      - WHATSAPP_RELAY_PORT=8787
    expose:
      - "8787"
    profiles: ["notifications"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Optional recurring discovery. It runs Indeed hourly and adds LinkedIn
  # every three hours; adjust the intervals in .env as needed.
  pipeline-scheduler:
    image: job-apply:latest
    command: ["node", "/app/scripts/pipeline-scheduler.mjs"]
    env_file:
      - path: ./.env
        required: false
    volumes:
      - ./data:/app/data
    depends_on:
      job-ops:
        condition: service_healthy
    profiles: ["scheduler"]
    restart: unless-stopped
    healthcheck:
      disable: true

# Volumes for data persistence
volumes:
  data:
