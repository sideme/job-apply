# =============================================================================
# Job Ops - Docker Compose Configuration
# =============================================================================

services:
  job-ops:
    build:
      context: .
      dockerfile: Dockerfile
    image: job-apply:latest
    container_name: job-apply
    ports:
      - "3005:3001"
    volumes:
      # Persist database and generated PDFs
      - ./data:/app/data
    environment:
      # Server config
      - NODE_ENV=production
      - PORT=3001

      # Python path (uses system python in container)
      - PYTHON_PATH=/usr/bin/python3

    env_file:
      - path: ./.env
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    develop:
      watch:
        # Rebuild container when package.json changes
        - path: ./orchestrator/package.json
          action: rebuild
        - path: ./orchestrator/package-lock.json
          action: rebuild
        # Sync source code changes and rebuild inside container
        - path: ./orchestrator/src
          target: /app/orchestrator/src
          action: sync+restart
        # Sync extractor changes
        - path: ./extractors/adzuna/src
          target: /app/extractors/adzuna/src
          action: sync+restart
        - path: ./extractors/jobspy
          target: /app/extractors/jobspy
          action: sync+restart

  # Optional recurring discovery. It runs at 10:00, 12:00, 14:00, 16:00,
  # and 18:00 on weekdays in the configured timezone.
  pipeline-scheduler:
    image: job-apply:latest
    command: ["node", "/app/scripts/pipeline-scheduler.mjs"]
    environment:
      # Indeed + LinkedIn refresh on every 2-hour slot. Adzuna is an API with a
      # monthly quota, so it runs only on the first slot of each weekday
      # (10:00 Toronto) to keep its results fresh without burning the quota.
      PIPELINE_SCHEDULE_SOURCES: "indeed,linkedin"
      PIPELINE_SCHEDULE_DAILY_SOURCES: "adzuna"
    env_file:
      - path: ./.env
        required: false
    volumes:
      - ./data:/app/data
    depends_on:
      job-ops:
        condition: service_healthy
    profiles: ["scheduler"]
    restart: unless-stopped
    healthcheck:
      disable: true

# Volumes for data persistence
volumes:
  data:
